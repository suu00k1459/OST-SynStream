services:
  kafka:
    image: apache/kafka:3.8.0
    container_name: synstream-kafka
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - synstream-net

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: synstream-kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: synstream-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      - kafka
    networks:
      - synstream-net

  replay-producer:
    build:
      context: .
      dockerfile: ingestion_flink/Dockerfile
    container_name: synstream-replay-producer
    command: ["python", "ingestion_flink/replay_producer.py"]
    environment:
      KAFKA_BROKER: kafka:9092
      TOPIC_RAW_SENSORS: sensors.raw
      REPLAY_HZ: "5.0"
    volumes:
      - ./data:/app/data
    depends_on:
      - kafka
    networks:
      - synstream-net

  flink-processor:
    build:
      context: .
      dockerfile: ingestion_flink/Dockerfile
    container_name: synstream-flink-processor
    command: ["python", "ingestion_flink/flink_window_processor.py"]
    environment:
      KAFKA_BROKER: kafka:9092
      TOPIC_RAW_SENSORS: sensors.raw
      TOPIC_WINDOWED_REAL: sensors.windowed.real
      TOPIC_FEATURES_REAL: sensors.features.real
      WINDOW_SIZE: "24"
      WINDOW_SLIDE: "4"
    depends_on:
      - kafka
      - replay-producer
    networks:
      - synstream-net

  influxdb:
    image: influxdb:2.7
    container_name: synstream-influxdb
    ports:
      - "8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: synstream_password
      DOCKER_INFLUXDB_INIT_ORG: synstream_org
      DOCKER_INFLUXDB_INIT_BUCKET: synstream_bucket
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: synstream-secret-token
    volumes:
      - influxdb_data:/var/lib/influxdb2
    networks:
      - synstream-net
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  influx-sink:
    build:
      context: .
      dockerfile: storage_influx/Dockerfile
    container_name: synstream-influx-sink
    command: ["python", "storage_influx/kafka_to_influx.py"]
    environment:
      KAFKA_BROKER: kafka:9092
      INFLUX_URL: http://influxdb:8086
      INFLUX_TOKEN: synstream-secret-token
      INFLUX_ORG: synstream_org
      INFLUX_BUCKET: synstream_bucket
      TOPIC_RAW_SENSORS: sensors.raw
      TOPIC_FEATURES_REAL: sensors.features.real
    depends_on:
      kafka:
        condition: service_started
      influxdb:
        condition: service_healthy
    networks:
      - synstream-net

  river-uci:                    # Pipelines 3 + 4 on UCI (anomaly + drift)
    build: ./stream_analytics
    container_name: synstream-river-uci
    command: ["python", "river_anomaly_drift.py", "--dataset", "uci", "--kafka"]
    environment:
      KAFKA_BROKER: kafka:9092
    depends_on:
      - kafka
    restart: unless-stopped
    networks:
      - synstream-net

  pipeline5:                    # live real-vs-synthetic window comparison
    build: ./stream_analytics
    container_name: synstream-pipeline5
    command: ["python", "window_comparator.py", "--kafka"]
    environment:
      KAFKA_BROKER: kafka:9092
    depends_on:
      - kafka
    restart: unless-stopped
    networks:
      - synstream-net

networks:
  synstream-net:
    driver: bridge

volumes:
  influxdb_data: