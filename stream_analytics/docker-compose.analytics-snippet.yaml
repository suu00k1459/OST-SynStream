# Paste these three services under `services:` in the team docker-compose.yaml (main branch).
# They use the same network as kafka, so the broker address is kafka:9092.
# Build context = the stream_analytics folder (its results/ must contain uci_scaler.npz,
# uci_train_windows.npy and, for HAI, hai_sensors.json / hai_scaler.npz).

  river-uci:                       # Pipeline 3 + 4 on UCI (anomaly + drift)
    build: ./stream_analytics
    command: ["python", "river_anomaly_drift.py", "--dataset", "uci", "--kafka"]
    environment:
      KAFKA_BROKER: kafka:9092
    depends_on: [kafka]
    restart: unless-stopped

  river-hai:                       # Pipeline 3 + 4 on HAI
    build: ./stream_analytics
    command: ["python", "river_anomaly_drift.py", "--dataset", "hai", "--kafka"]
    environment:
      KAFKA_BROKER: kafka:9092
    depends_on: [kafka]
    restart: unless-stopped

  pipeline5:                       # live real-vs-synthetic window comparison
    build: ./stream_analytics
    command: ["python", "window_comparator.py", "--kafka"]
    environment:
      KAFKA_BROKER: kafka:9092
    depends_on: [kafka]
    restart: unless-stopped
