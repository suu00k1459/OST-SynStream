apiVersion: 1

datasources:
  - name: influxdb
    uid: influxdb
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    isDefault: true
    jsonData:
      version: Flux
      organization: synstream_org
      defaultBucket: synstream_bucket
    secureJsonData:
      token: synstream-secret-token
